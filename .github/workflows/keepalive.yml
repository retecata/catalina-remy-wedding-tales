name: Keep backend awake

on:
  schedule:
    # Every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          curl -s -o /dev/null -w "db:%{http_code}\n" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/rsvps?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
      - name: Ping gallery function
        run: |
          curl -s -o /dev/null -w "fn:%{http_code}\n" \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/list-photos" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
